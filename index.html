
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKu Dashboard</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">
  <div class="mobile-overlay" id="mobile-overlay" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <div class="logo">TokoKu<span>MANAGEMENT</span></div>
    </div>

    <nav class="nav">
      <div class="nav-item active" onclick="navigate('home')">🏠 Beranda</div>
      <div class="nav-item" onclick="navigate('login')">🔐 Login</div>
      <div class="nav-item" onclick="showProducts()">📦 Produk</div>
      <div class="nav-item" onclick="showTransactions()">💳 Transaksi</div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-username">Admin</div>
          <div class="user-role" id="sidebar-role">Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
      <div class="page-title">Dashboard</div>
    </div>

    <div class="content">

      <div id="page-home" class="page active">
        <h1>Selamat Datang di TokoKu</h1>
        <p>Dashboard manajemen toko modern.</p>
      </div>

      <div id="page-login" class="page">
        <h2>Login</h2>
        <input type="text" id="login-user" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="doLogin()">Masuk</button>
      </div>

      <div id="page-products" class="page">
        <div class="page-header">
          <h2>Produk</h2>
          <button class="btn-primary" onclick="openAddProductForm()">+ Tambah Produk</button>
        </div>
        <div id="product-grid"></div>
      </div>

      <div id="page-transactions" class="page">
        <div class="page-header">
          <h2>Transaksi</h2>
          <button class="btn-primary" onclick="openAddTransactionForm()">+ Tambah Transaksi</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Pelanggan</th>
              <th>Total</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="trx-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Modal Produk -->
<div id="product-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeProductModal()">&times;</span>
    <h2 id="product-form-title">Tambah Produk Baru</h2>
    <form id="product-form">
      <input type="hidden" id="product-form-mode" value="add">
      <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" id="product-name" placeholder="Contoh: iPhone 15 Pro" required>
      </div>
      <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" id="product-price" placeholder="Contoh: 18999000" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-primary" onclick="saveProduct()">Simpan</button>
        <button type="button" class="btn-secondary" onclick="closeProductModal()">Batal</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Transaksi -->
<div id="trx-modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeTransactionModal()">&times;</span>
    <h2 id="trx-form-title">Tambah Transaksi Baru</h2>
    <form id="trx-form">
      <input type="hidden" id="trx-form-mode" value="add">
      <div class="form-group">
        <label>Kode Transaksi</label>
        <input type="text" id="trx-code" placeholder="Contoh: TRX001" required>
      </div>
      <div class="form-group">
        <label>Nama Pelanggan</label>
        <input type="text" id="trx-customer" placeholder="Contoh: Budi" required>
      </div>
      <div class="form-group">
        <label>Total (Rp)</label>
        <input type="number" id="trx-total" placeholder="Contoh: 500000" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-primary" onclick="saveTransaction()">Simpan</button>
        <button type="button" class="btn-secondary" onclick="closeTransactionModal()">Batal</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
